# Автоответ @kodsyz: каждые 30 минут дёргаем /api/run на Vercel
name: autoreply
on:
  schedule:
    - cron: "*/30 * * * *"  # приватный репозиторий: 30 мин укладываются в бесплатные 2000 минут Actions
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.BOT_URL }}/api/run" -H "x-run-secret: ${{ secrets.RUN_SECRET }}"
